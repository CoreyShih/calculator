<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="frame">
            <div class="display">
                <div></div>
            </div>

            <div class="keypad">
                <div class="operands">
                    <div class="row">
                        <button>7</button>
                        <button>8</button>
                        <button>9</button>
                    </div>

                    <div class="row">
                        <button>4</button>
                        <button>5</button>
                        <button>6</button>
                    </div>

                    <div class="row">
                        <button>1</button>
                        <button>2</button>
                        <button>3</button>
                    </div>

                    <div class="row">
                        <button id="key-0">0</button>
                        <button id="key-decimal">.</button>
                    </div>
                </div>

                <div class="operators">
                    <div class="col">
                        <button>÷</button>
                        <button>×</button>
                        <button>-</button>
                        <button>+</button>
                    </div>

                    <div class="col">
                        <button id="key-clear">C</button>
                        <button id="key-equals">=</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
